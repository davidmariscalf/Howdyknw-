name: Android TV build
on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify AES-256-GCM Android/browser interoperability vectors
        run: |
          mkdir -p /tmp/howdyknw-crypto-test
          javac -d /tmp/howdyknw-crypto-test android-tv/app/src/main/java/com/howdyknw/tv/AudioCrypto.java android-tv/tests/AudioCryptoSmoke.java
          java -cp /tmp/howdyknw-crypto-test com.howdyknw.tv.AudioCryptoSmoke
      - name: Build native Android TV debug APK
        run: gradle -p android-tv :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: howdyknw-android-tv-debug
          path: android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
