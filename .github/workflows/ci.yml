name: Quality checks
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python unit tests
        run: python -m unittest -v
      - name: Python compile
        run: python -m py_compile howdyknw.py tv_monitor.py
      - name: Tizen package manifest parses
        run: python -c "import xml.etree.ElementTree as e; e.parse('tizen-tv/config.xml')"
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check
        run: |
          node --check server.js
          node --check public/app.js
          node --check public/report-utils.js
          node --check public/experiments.js
          node --check public/pcm-playback.js
          node --check tizen-tv/app.js
      - name: Node integration tests
        run: npm test
